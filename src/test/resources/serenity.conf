webdriver {
        driver = "appium"
        
        capabilities {
            "appium:platformName" = "Android"
            "appium:automationName" = "UiAutomator2"
        }
    }


serenity {
  logging = VERBOSE

  # Evita que Serenity aborte la suite completa si falla el arranque del driver en un escenario
  restart.browser.for.each = SCENARIO

  # Fuerza a Serenity a continuar incluso si sospecha que el driver tuvo un comportamiento inusual
  dry.run = false
  
  # Configs for Serenity
  take-screenshots = FOR_FAILURES
  save-test-source-at = "target/serenity/test-source"
  test-source-directory = "src/test/resources/features"

}

environments {
    android{
        myDebugProperty = "LOADED_OK"
    
        appium {    
            hub = "http://127.0.0.1:4723/"
            "appium:app" = "C:/Users/malsogaray.NET01/appium-demo/src/apps/platform_app_debug_3.5.0.0_newland_n910.apk"
            "appium:platformVersion" = "10"
            "appium:deviceName" = "N910plus"
            "appium:appPackage" = "br.com.phoebus.paystore.platform.newland"
            "appium:appActivity" = "br.com.phoebus.android.platform.ui.activity.MainActivity"
            "appium:udid" = "0123456789ABCDEF"
            "appium:ensureWebviewsHavePages" = true
            "appium:nativeWebScreenshot" = true
            "appium:newCommandTimeout" = "3600"
            "appium:connectHardwareKeyboard" = true
            "appium:ignoreUnimportantViews" = false      
        }
        # Configs Validation Images
        generate-base-screens = false
        fails-when-verify-screen = true

        # Terminal Properties
        terminal-model = "N910Plus"
        terminal-serial-number = "N7A304965014"
        sub-acquirer-id = "19"

        # N910
        # terminal-model = "N910"
        # terminal-serial-number = "N78802713995"
        # sub-acquirer-id = "19"

    configuration {
             # Configs run properties
            "appium:amessage-mipyme" = ",Compra efectuada en {cuotas} cuotas MiPyME^"
            "appium:terminal-with-paper" = false
            "appium:verify-initialization" = false
            "appium:verify-receipt-trx" = true

            # Config Arduino
            "appium:connected-arduino" = false
            "appium:appport-name-arduino" = "CH340"

            # Config Specific Parameters
            "appium:allow-multi-merchant" = false
            "appium:group-visa-mastercard" = true
            "appium:allow-tip" = false
            "appium:allow-multi-currency" = false
        }
    }
}
